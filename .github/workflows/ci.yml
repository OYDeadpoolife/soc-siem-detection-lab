name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.8 is no longer provided on the newest Ubuntu image, so it runs on Ubuntu 24.04.
          # It installs pytest only: the newest shfmt that pip can install on 3.8 is an old release that formats
          # shell code differently, so the pip-installed shfmt is used only in the 3.12 job.
          - { os: ubuntu-24.04, python: "3.8", deps: "pytest" }
          - { os: ubuntu-latest, python: "3.12", deps: "-r requirements-dev.txt" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install test tools
        run: python -m pip install ${{ matrix.deps }}

      - name: Run the test suite
        run: python -m pytest -v
